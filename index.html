<!doctype html>
<html lang="en" data-theme="atelier">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Curio & Co. — Premium Corporate Gifting Solutions</title>
    <meta name="description" content="Premium corporate gifting solutions for teams, clients, and occasions that matter. Curated products, custom branding, and white-glove delivery across India." />
    <meta name="keywords" content="corporate gifting, bulk gifts, employee gifts, branded merchandise, custom gifts India" />
    <meta name="theme-color" content="#FAF7F2" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Curio & Co. — Premium Corporate Gifting" />
    <meta property="og:description" content="The art of giving, made extraordinary. Premium corporate gifting solutions across India." />
    <meta property="og:url" content="https://curioandco.in" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts — preconnect first for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash — applied before React hydrates -->
    <script>
      try {
        var stored = localStorage.getItem('curio-theme');
        var parsed = stored ? JSON.parse(stored) : null;
        var t = parsed && parsed.state && parsed.state.theme;
        if (t === 'obsidian' || t === 'studio') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
